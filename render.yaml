services:
  - type: web
    name: korean-learning-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free  # free plan - có thể sleep sau 15 phút không dùng
    # region: singapore  # region chỉ có trên paid plans
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: korean-learning-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: POSTGRES_URL
        fromDatabase:
          name: korean-learning-db
          property: connectionString
    healthCheckPath: /docs
    # Uncomment nếu muốn chạy migrations tự động khi deploy
    # buildCommand: alembic upgrade head
    
    # Note: Redis environment variables need to be set manually in Render dashboard:
    # - REDIS_CACHE_URL (from Redis service's Connections tab)
    # - REDIS_QUEUE_URL (same as REDIS_CACHE_URL or separate)
    # - REDIS_RATE_LIMITER_URL (same as REDIS_CACHE_URL or separate)
    # - REDIS_QUEUE_HOST (extract host from REDIS_CACHE_URL)
    # - REDIS_QUEUE_PORT (usually 6379)

databases:
  - name: korean-learning-db
    databaseName: korean_learning
    user: korean_user
    plan: free  # free hoặc starter

  - name: korean-learning-redis
    plan: free  # free hoặc starter
